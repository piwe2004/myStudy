<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#f5f6f8">
    <title>CS 문제은행</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">

        <!-- 홈 -->
        <main id="home-screen">
            <header class="home-header">
                <h1 class="main-title">CS 문제은행</h1>
                <p class="sub-title">문제 불러오는 중...</p>
            </header>

            <div class="main-tabs" role="tablist">
                <button class="main-tab-btn active" data-tab="knou" onclick="filterTab('knou')">방통대 CS</button>
                <button class="main-tab-btn" data-tab="engineer" onclick="filterTab('engineer')">정보처리기사</button>
            </div>

            <div id="subject-list"></div>
        </main>

        <!-- 퀴즈 -->
        <section id="quiz-screen" hidden>
            <header class="header">
                <button onclick="goHome()" class="back-btn" aria-label="나가기">✕</button>
                <span id="current-subject-title">과목명</span>
                <span id="progress-text">1 / 25</span>
            </header>
            <div class="progress"><div id="progress-bar"></div></div>

            <div class="quiz-content">
                <p id="question-text"></p>
                <div id="options-box" class="options-list"></div>
                <div id="result-box" hidden></div>
            </div>

            <div class="bottom-bar">
                <button id="next-btn" onclick="nextQuestion()" hidden>다음 문제</button>
            </div>
        </section>

        <!-- 결과 -->
        <section id="score-screen" hidden>
            <div class="score-card">
                <p class="score-label">결과</p>
                <div class="score-ring" id="score-ring">
                    <span id="final-score">0</span><span class="unit">점</span>
                </div>
                <div class="stats-box">
                    <div class="stat-item">
                        <span class="value" id="total-count-display">0</span>
                        <span class="label">총 문제</span>
                    </div>
                    <div class="stat-item">
                        <span class="value correct" id="correct-count-display">0</span>
                        <span class="label">정답</span>
                    </div>
                    <div class="stat-item">
                        <span class="value wrong" id="wrong-count-display">0</span>
                        <span class="label">오답</span>
                    </div>
                </div>
                <button onclick="retry()" class="primary-btn">같은 과목 다시 풀기</button>
                <button onclick="goHome()" class="ghost-btn">과목 선택으로</button>
            </div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
